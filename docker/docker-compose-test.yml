services:
  mongo:
    image: mongo:8
    container_name: mongo
    volumes:
      - data:/data/db

  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "3042:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/note
      JWT_SECRET: changethis
    depends_on:
      - mongo

volumes:
  data:
